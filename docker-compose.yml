version: '3.8'

services:
  # Frontend - SmartHome Monitor Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-frontend
    ports:
      - "80:80"
    environment:
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-http://192.168.1.100}
      - VITE_GATEWAY_TOKEN=${VITE_GATEWAY_TOKEN:-}
    restart: unless-stopped
    networks:
      - smarthome-network

